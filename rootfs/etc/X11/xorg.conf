Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection
Section "Module"
    Load "fbdevhw"
    Load "shadow"
EndSection
Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
    Identifier "screen0"
    Device "fb"
    DefaultDepth 16
EndSection
Section "ServerLayout"
    Identifier "layout"
    Screen "screen0"
EndSection
